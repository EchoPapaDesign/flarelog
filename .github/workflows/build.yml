# Baut das Projekt und führt den Selbsttest bei jedem Push und Pull Request aus.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Bauen
        run: dotnet build -c Release

      - name: Selbsttest
        run: dotnet run --project tests/AeroflyAcars.SelfTest -c Release --no-build

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Selbsttest unter macOS
        run: dotnet run --project tests/AeroflyAcars.SelfTest -c Release

      - name: Flarelog.app bauen (Apple Silicon und Intel)
        run: |
          ./build-mac.sh 0.0.0-ci osx-arm64
          ./build-mac.sh 0.0.0-ci osx-x64

      - name: Probestart (Apple Silicon)
        run: |
          ditto -x -k publish/Flarelog-macOS-AppleSilicon.zip probe
          codesign --verify --verbose probe/Flarelog.app
          ./probe/Flarelog.app/Contents/MacOS/Flarelog &
          pid=$!
          for i in $(seq 1 20); do curl -sf http://localhost:8080/api/state > state.json && break; sleep 1; done
          kill -TERM $pid
          # Muss sich innerhalb von 20 s selbst beenden (Fenster schließen, Flug speichern).
          for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "Flarelog hat sich nach SIGTERM nicht beendet"; exit 1; fi
          echo "--- Flarelog.log ---"; cat ~/Library/Logs/Flarelog.log || true
          grep -q '"canQuit":true' state.json
          echo "Display antwortet, Beenden-Knopf aktiv"

      - uses: actions/upload-artifact@v4
        with:
          name: Flarelog-macOS
          path: publish/*.zip
