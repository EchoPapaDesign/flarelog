# Veröffentlicht eine neue Version und hängt Flarelog.exe an.
#
# Releases → "Draft a new release" → neuen Tag wie v0.9.0-beta.2 anlegen → Publish.
# GitHub baut dann, testet und hängt Flarelog.exe an dieses Release an (dauert ein paar Minuten).
name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version aus dem Tag
        id: version
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          number="${tag#[vV]}"
          number="${number#.}"          # auch "v.0.9.0" zulassen
          if ! [[ "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$tag' ist keine Versionsnummer. Erwartet z. B. v0.9.0 oder v0.9.0-beta.1"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Selbsttest
        run: dotnet run --project tests/AeroflyAcars.SelfTest -c Release -p:Version=${{ steps.version.outputs.number }}

      - name: Flarelog.exe erzeugen
        run: >
          dotnet publish src/AeroflyAcars.Desktop -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.number }} -o publish

      # Titel und Text des Releases bleiben wie auf der Webseite eingegeben – nur die Datei kommt dazu.
      - name: Flarelog.exe an das Release hängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: publish/Flarelog.exe
